name: CI

on:
  push:
    branches: [main, "update/*"]
  pull_request:
    branches: [main]

jobs:
  evaluate:
    name: Evaluate NixOS configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Evaluate all host configurations
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          hosts=(gaming-pc optiplex blaney-pc justus-pc asus-laptop asus-m15 atl-mini-pc optiplex-nas mini-server vm-sandbox vm-blaney)
          failed=0
          for host in "${hosts[@]}"; do
            echo "::group::Evaluating $host"
            if nix eval --impure ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath" 2>&1; then
              echo "✓ $host OK"
            else
              echo "✗ $host FAILED"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  release-pins:
    name: App pin bumps are their own PR
    # insideabush's apps (pkgs/<app> with owner = "cblaney00") are built from his project
    # folders on blaney-pc, so their pins are *releases* for other machines. A pin bump
    # riding along in a feature PR is what kept conflicting (#242, #248, #249), so a PR
    # that moves one of those pins may change nothing but that one app's pkgs/<app>/ (and
    # docs/companion-repos.md). Rules: docs/companion-repos.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release PR shape
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          bumped=()
          for f in $(git diff --name-only "$BASE"...HEAD -- 'pkgs/*/default.nix'); do
            # a brand-new package (packaging PR) has nothing on the base side to compare
            git show "$BASE:$f" 2>/dev/null | grep -q 'owner = "cblaney00"' || continue
            if git diff "$BASE"...HEAD -- "$f" | grep -qE '^[-+][[:space:]]*rev = '; then
              bumped+=("${f%default.nix}")
            fi
          done
          [ ${#bumped[@]} -eq 0 ] && { echo "No app pin moved."; exit 0; }
          echo "Pin moved for: ${bumped[*]}"
          if [ ${#bumped[@]} -gt 1 ]; then
            echo "::error::A release PR bumps one app. Split these into one PR each: ${bumped[*]}"
            exit 1
          fi
          extra=$(git diff --name-only "$BASE"...HEAD |
            grep -v -e "^${bumped[0]}" -e '^docs/companion-repos.md$' || true)
          if [ -n "$extra" ]; then
            echo "::error::This PR bumps the ${bumped[0]} pin and also changes other files. A pin bump is a release and goes in its own PR (blaney/release-<app>, cut from main); drop it from this one."
            printf '  %s\n' $extra
            exit 1
          fi
          echo "Release PR: only ${bumped[0]} changes."

  build:
    name: Build fragile derivations
    # Runs on the self-hosted runner on optiplex-nas — its Nix store is warm from the
    # nightly flake-updater, so incremental PR builds only recompile changed derivations.
    runs-on: [self-hosted, nixos]
    needs: evaluate
    # Only run on branches inside this repo (push) or same-repo PRs — never on fork PRs,
    # since a self-hosted runner must not execute untrusted code. Fork PRs still get the
    # `evaluate` gate on the GitHub-hosted runner.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build fragile derivations
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          # Realize only the fragile *source-built* derivations this repo carries — NOT full
          # host toplevels. Building toplevels drags in browsers/steam/kernels that are
          # usually cached but OOM this modest NAS whenever they momentarily fall out of the
          # binary cache (e.g. an aged-out librewolf pin), for zero benefit to what we test.
          # These targets are the small C++/kernel-module builds that actually break on
          # nixpkgs bumps. The `evaluate` job still type-checks every full toplevel.
          #
          # aerothemeplasma's ~13 KWin/Plasma C++ derivations used to be built here via the
          # overlay on vm-sandbox. The theme is now mothballed — no host selects
          # homeManager.themes.kde = "windows7-alt", so the gated overlay in
          # modules/nixos/themes/aerothemeplasma/plasma-system.nix is never applied and those
          # attributes do not exist on pkgs at all. Listing them here would be an *evaluation*
          # error, not just a wasted build. If the theme is ever re-enabled on a host, restore
          # the target list along with it (git log this file).
          targets=()
          # openrazer out-of-tree module, patched for the current kernel — from a host that
          # enables it. blaney-pc + optiplex share a kernel, so one build covers both.
          targets+=(".#nixosConfigurations.blaney-pc.config.boot.kernelPackages.openrazer")
          echo "Building ${#targets[@]} fragile derivations:"
          printf '  %s\n' "${targets[@]}"
          nix build --impure --no-link --print-out-paths "${targets[@]}"
