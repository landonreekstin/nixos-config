# Home Assistant Lighting Automations
#
# Lights: light.right_desk_lamp, light.standing_lamp (Kasa, color_temp + hs)
#         light.nightstand_lamp (Cync, color_temp + rgb)
#
# Schedule:
#   Pre-dawn (Mon/Tue/Wed/Thu): Standing lamp on deep red 5% at 5:45 AM
#   Morning (Mon/Tue/Wed/Thu): On 100% warm white at 6:14 AM, off at 7:15 AM
#   Evening (every day): On 100% warm white 1hr before sunset
#   Every day: Shift warm white -> amber from sunset to dusk, -> deep red by 1hr after dusk,
#              dim to 25% from 9-10 PM (starts later in summer, once the lights are red)

# ==================== PRE-DAWN LAMP (Mon/Tue/Wed/Thu) ====================

- id: predawn_standing_lamp
  alias: "Pre-Dawn Standing Lamp"
  description: "Turn on the standing lamp deep red at 5% at 5:45 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "05:45:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_on
      target:
        entity_id: light.standing_lamp
      data:
        hs_color:
          - 0
          - 100
        brightness_pct: 5

# ==================== MORNING LIGHTS (Mon/Tue/Wed/Thu) ====================

- id: morning_lights_on
  alias: "Morning Lights On"
  description: "Turn on all lights 100% warm white at 6:14 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "06:14:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_on
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp
      data:
        # hs 40,40 = warm white (matches color-shift start). Avoids Cync
        # integration bug where color_temp_kelvin: 2700 falls outside the
        # 1-100 scaled range the Cync device library requires.
        hs_color:
          - 40
          - 40
        brightness_pct: 100

- id: morning_lights_off
  alias: "Morning Lights Off"
  description: "Turn off all lights at 7:15 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "07:15:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_off
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp

# ==================== EVENING LIGHTS ON (Every Day) ====================

- id: evening_lights_on
  alias: "Evening Lights On"
  description: "Turn on all lights 100% warm white 1 hour before sunset"
  triggers:
    - trigger: sun
      event: sunset
      offset: "-01:00:00"
  actions:
    - service: light.turn_on
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp
      data:
        # hs 40,40 = warm white (matches color-shift start). Avoids Cync
        # integration bug where color_temp_kelvin: 2700 falls outside the
        # 1-100 scaled range the Cync device library requires.
        hs_color:
          - 40
          - 40
        brightness_pct: 100

# ==================== EVENING COLOR SHIFT (Every Day) ====================
# Two phases, starting at sunset (lights have been warm white since sunset-1hr):
#   1. sunset -> civil dusk:  warm white (hs 40,40) -> amber    (hs 35,85)
#   2. dusk -> dusk + 1hr:    amber      (hs 35,85) -> deep red (hs 0,100)
# Civil dusk = sun 6 degrees below the horizon (dark outside), ~30-40 min after
# sunset. Full red lands ~6:15 PM in December, ~10:10 PM at the June solstice.

- id: evening_color_shift
  alias: "Evening Color Shift"
  description: "Warm white to amber from sunset to dusk, then amber to deep red over the hour after dusk"
  triggers:
    - trigger: sun
      event: sunset
  mode: restart
  actions:
    - variables:
        step_seconds: 120
        # Fired at sunset, so sensor.sun_next_dusk is still today's dusk.
        # Falls back to 35 min out if the sun sensor is unavailable.
        dusk_seconds: >
          {% set dusk = states('sensor.sun_next_dusk') | as_datetime(none) %}
          {% set secs = (dusk - now()).total_seconds() if dusk else 2100 %}
          {{ [[secs | int, 600] | max, 7200] | min }}
        dusk_steps: "{{ [(dusk_seconds / step_seconds) | int, 1] | max }}"
        red_steps: "{{ (3600 / step_seconds) | int }}"
    # Phase 1: warm white -> amber, sunset to dusk
    - repeat:
        count: "{{ dusk_steps }}"
        sequence:
          - variables:
              progress: "{{ repeat.index / dusk_steps }}"
              hue: "{{ (40 - 5 * progress) | round(1) }}"
              sat: "{{ (40 + 45 * progress) | round(1) }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - "{{ hue }}"
                - "{{ sat }}"
              brightness_pct: 100
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"
    # Phase 2: amber -> deep red, over the hour after dusk
    - repeat:
        count: "{{ red_steps }}"
        sequence:
          - variables:
              progress: "{{ repeat.index / red_steps }}"
              hue: "{{ (35 * (1 - progress)) | round(1) }}"
              sat: "{{ (85 + 15 * progress) | round(1) }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - "{{ hue }}"
                - "{{ sat }}"
              brightness_pct: 100
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"

# ==================== EVENING DIMMING (Every Day) ====================
# Hold deep red, then dim 100% -> 25% from 9-10 PM. From ~April to ~August the
# lights aren't red until after 9 PM (up to ~10:10 PM at the June solstice), so
# wait for the color shift to finish first; the dim then starts later.

- id: evening_dim
  alias: "Evening Dim"
  description: "Gradually dim lights from 100% to 25% starting at 9 PM"
  triggers:
    - trigger: time
      at: "21:00:00"
  mode: restart
  actions:
    - wait_template: "{{ state_attr('automation.evening_color_shift', 'current') | int(0) == 0 }}"
      timeout: "02:00:00"
    - variables:
        total_steps: 12
        step_seconds: 300
    - repeat:
        count: "{{ total_steps }}"
        sequence:
          - variables:
              progress: "{{ repeat.index / total_steps}}"
              brightness: "{{ (100 - 75 * progress) | round(0) | int }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - 0
                - 100
              brightness_pct: "{{ brightness }}"
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"
