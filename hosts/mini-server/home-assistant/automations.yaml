# Home Assistant Lighting Automations
#
# Lights: light.right_desk_lamp, light.standing_lamp (Kasa, color_temp + hs)
#         light.nightstand_lamp (Cync, color_temp + rgb)
#
# Schedule:
#   Pre-dawn (Mon/Tue/Wed/Thu): Standing lamp on deep red 5% at 5:45 AM
#   Morning (Mon/Tue/Wed/Thu): On 100% warm white at 6:14 AM, off at 7:15 AM
#   Evening (every day): On 100% warm white 1hr before sunset
#   Every day: From sunset or 6 PM (whichever first) shift warm white -> amber by dusk/7 PM,
#              -> deep red by dusk+1hr/8 PM, then dim to 50% by 9 PM and 25% by 10 PM

# ==================== PRE-DAWN LAMP (Mon/Tue/Wed/Thu) ====================

- id: predawn_standing_lamp
  alias: "Pre-Dawn Standing Lamp"
  description: "Turn on the standing lamp deep red at 5% at 5:45 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "05:45:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_on
      target:
        entity_id: light.standing_lamp
      data:
        hs_color:
          - 0
          - 100
        brightness_pct: 5

# ==================== MORNING LIGHTS (Mon/Tue/Wed/Thu) ====================

- id: morning_lights_on
  alias: "Morning Lights On"
  description: "Turn on all lights 100% warm white at 6:14 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "06:14:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_on
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp
      data:
        # hs 40,40 = warm white (matches color-shift start). Avoids Cync
        # integration bug where color_temp_kelvin: 2700 falls outside the
        # 1-100 scaled range the Cync device library requires.
        hs_color:
          - 40
          - 40
        brightness_pct: 100

- id: morning_lights_off
  alias: "Morning Lights Off"
  description: "Turn off all lights at 7:15 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "07:15:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_off
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp

# ==================== EVENING LIGHTS ON (Every Day) ====================

- id: evening_lights_on
  alias: "Evening Lights On"
  description: "Turn on all lights 100% warm white 1 hour before sunset"
  triggers:
    - trigger: sun
      event: sunset
      offset: "-01:00:00"
  actions:
    - service: light.turn_on
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp
      data:
        # hs 40,40 = warm white (matches color-shift start). Avoids Cync
        # integration bug where color_temp_kelvin: 2700 falls outside the
        # 1-100 scaled range the Cync device library requires.
        hs_color:
          - 40
          - 40
        brightness_pct: 100

# ==================== EVENING COLOR SHIFT (Every Day) ====================
# Follows the sun in winter, capped by the clock in summer. Each milestone is
# whichever comes FIRST (only lamps that are on get changed):
#   start (warm white, hs 40,40): sunset           or 6 PM
#   amber (hs 35,85):             civil dusk        or 7 PM
#   deep red (hs 0,100):          dusk + 1hr        or 8 PM
# St. Louis: mid-Nov ~4:42 -> 5:12 -> 6:12 PM; June 6 -> 7 -> 8 PM.
# In summer the lamps don't come on until sunset-1hr (~7:30 PM), so they join
# partway through, already close to red.

- id: evening_color_shift
  alias: "Evening Color Shift"
  description: "Warm white to amber by dusk or 7 PM, then deep red by dusk+1hr or 8 PM, starting at sunset or 6 PM, whichever is first"
  triggers:
    - trigger: sun
      event: sunset
      id: sunset
    - trigger: time
      at: "18:00:00"
      id: clock
  # Run only on whichever trigger comes first today: sunset counts only before
  # 6 PM, and 6 PM counts only while the sun is still up.
  conditions:
    - condition: or
      conditions:
        - condition: and
          conditions:
            - condition: trigger
              id: sunset
            - condition: time
              before: "18:00:00"
        - condition: and
          conditions:
            - condition: trigger
              id: clock
            - condition: state
              entity_id: sun.sun
              state: above_horizon
  mode: single
  max_exceeded: silent
  actions:
    - variables:
        step_seconds: 120
        # Fired at sunset or 6 PM before sunset, so sensor.sun_next_dusk is still
        # today's dusk. If the sensor is unavailable, fall back to the clock times.
        amber_at: >
          {% set d = states('sensor.sun_next_dusk') | as_datetime(none) %}
          {% set clock = today_at('19:00') %}
          {{ ([d | as_local, clock] | min) if d else clock }}
        red_at: >
          {% set d = states('sensor.sun_next_dusk') | as_datetime(none) %}
          {% set clock = today_at('20:00') %}
          {{ ([(d | as_local) + timedelta(hours=1), clock] | min) if d else clock }}
        amber_steps: >
          {{ [((as_datetime(amber_at) - now()).total_seconds() / step_seconds) | int, 1] | max }}
        red_steps: >
          {{ [((as_datetime(red_at) - as_datetime(amber_at)).total_seconds() / step_seconds) | int, 1] | max }}
    # Phase 1: warm white -> amber, until dusk or 7 PM
    - repeat:
        count: "{{ amber_steps }}"
        sequence:
          - variables:
              progress: "{{ repeat.index / amber_steps }}"
              hue: "{{ (40 - 5 * progress) | round(1) }}"
              sat: "{{ (40 + 45 * progress) | round(1) }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - "{{ hue }}"
                - "{{ sat }}"
              brightness_pct: 100
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"
    # Phase 2: amber -> deep red, until dusk+1hr or 8 PM
    - repeat:
        count: "{{ red_steps }}"
        sequence:
          - variables:
              progress: "{{ repeat.index / red_steps }}"
              hue: "{{ (35 * (1 - progress)) | round(1) }}"
              sat: "{{ (85 + 15 * progress) | round(1) }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - "{{ hue }}"
                - "{{ sat }}"
              brightness_pct: 100
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"

# ==================== EVENING DIMMING (Every Day) ====================
# Hold deep red, dim 100% -> 50% by 9 PM, then 50% -> 25% by 10 PM. Starts at
# 8 PM, when the color shift has reached deep red; the wait is a guard in case
# the shift is still finishing (or was started late by hand).

- id: evening_dim
  alias: "Evening Dim"
  description: "Gradually dim lights to 50% by 9 PM, then to 25% by 10 PM"
  triggers:
    - trigger: time
      at: "20:00:00"
  mode: restart
  actions:
    - wait_template: "{{ state_attr('automation.evening_color_shift', 'current') | int(0) == 0 }}"
      timeout: "01:00:00"
    - variables:
        step_seconds: 300
        # Phase 1 ends at 9 PM sharp, however late the wait let us start.
        half_steps: >
          {{ [((today_at('21:00') - now()).total_seconds() / step_seconds) | int, 1] | max }}
        quarter_steps: 12
    # Phase 1: 100% -> 50%, until 9 PM
    - repeat:
        count: "{{ half_steps }}"
        sequence:
          - variables:
              brightness: "{{ (100 - 50 * repeat.index / half_steps) | round(0) | int }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - 0
                - 100
              brightness_pct: "{{ brightness }}"
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"
    # Phase 2: 50% -> 25%, 9-10 PM
    - repeat:
        count: "{{ quarter_steps }}"
        sequence:
          - variables:
              brightness: "{{ (50 - 25 * repeat.index / quarter_steps) | round(0) | int }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - 0
                - 100
              brightness_pct: "{{ brightness }}"
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"
