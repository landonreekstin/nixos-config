# Home Assistant Lighting Automations
#
# Lights: light.right_desk_lamp, light.standing_lamp (Kasa, color_temp + hs)
#         light.nightstand_lamp (Cync, color_temp + rgb)
#
# Schedule:
#   Pre-dawn (Mon/Tue/Wed/Thu): Standing lamp on deep red 5% at 5:45 AM
#   Morning (Mon/Tue/Wed/Thu): On 100% warm white at 6:14 AM, off at 7:15 AM
#   Evening (every day): On 100% warm white 1hr before sunset
#   Every day: Shift warm white -> amber 6-7 PM, -> deep red 7-8 PM, dim to 25% from 9-10 PM

# ==================== PRE-DAWN LAMP (Mon/Tue/Wed/Thu) ====================

- id: predawn_standing_lamp
  alias: "Pre-Dawn Standing Lamp"
  description: "Turn on the standing lamp deep red at 5% at 5:45 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "05:45:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_on
      target:
        entity_id: light.standing_lamp
      data:
        hs_color:
          - 0
          - 100
        brightness_pct: 5

# ==================== MORNING LIGHTS (Mon/Tue/Wed/Thu) ====================

- id: morning_lights_on
  alias: "Morning Lights On"
  description: "Turn on all lights 100% warm white at 6:14 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "06:14:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_on
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp
      data:
        # hs 40,40 = warm white (matches color-shift start). Avoids Cync
        # integration bug where color_temp_kelvin: 2700 falls outside the
        # 1-100 scaled range the Cync device library requires.
        hs_color:
          - 40
          - 40
        brightness_pct: 100

- id: morning_lights_off
  alias: "Morning Lights Off"
  description: "Turn off all lights at 7:15 AM on Mon/Tue/Wed/Thu"
  triggers:
    - trigger: time
      at: "07:15:00"
  conditions:
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
  actions:
    - service: light.turn_off
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp

# ==================== EVENING LIGHTS ON (Every Day) ====================

- id: evening_lights_on
  alias: "Evening Lights On"
  description: "Turn on all lights 100% warm white 1 hour before sunset"
  triggers:
    - trigger: sun
      event: sunset
      offset: "-01:00:00"
  actions:
    - service: light.turn_on
      target:
        entity_id:
          - light.right_desk_lamp
          - light.standing_lamp
          - light.nightstand_lamp
      data:
        # hs 40,40 = warm white (matches color-shift start). Avoids Cync
        # integration bug where color_temp_kelvin: 2700 falls outside the
        # 1-100 scaled range the Cync device library requires.
        hs_color:
          - 40
          - 40
        brightness_pct: 100

# ==================== EVENING COLOR SHIFT (Every Day) ====================
# Fixed clock times, year-round (only lamps that are on get changed):
#   6-7 PM:  warm white (hs 40,40) -> amber    (hs 35,85)
#   7-8 PM:  amber      (hs 35,85) -> deep red (hs 0,100)
# In summer the lamps don't come on until sunset-1hr (~7:30 PM), so they join
# partway through, already close to red.

- id: evening_color_shift
  alias: "Evening Color Shift"
  description: "Warm white to amber from 6-7 PM, then amber to deep red from 7-8 PM"
  triggers:
    - trigger: time
      at: "18:00:00"
  mode: restart
  actions:
    - variables:
        step_seconds: 120
        phase_steps: "{{ (3600 / step_seconds) | int }}"
    # Phase 1: warm white -> amber, 6-7 PM
    - repeat:
        count: "{{ phase_steps }}"
        sequence:
          - variables:
              progress: "{{ repeat.index / phase_steps }}"
              hue: "{{ (40 - 5 * progress) | round(1) }}"
              sat: "{{ (40 + 45 * progress) | round(1) }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - "{{ hue }}"
                - "{{ sat }}"
              brightness_pct: 100
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"
    # Phase 2: amber -> deep red, 7-8 PM
    - repeat:
        count: "{{ phase_steps }}"
        sequence:
          - variables:
              progress: "{{ repeat.index / phase_steps }}"
              hue: "{{ (35 * (1 - progress)) | round(1) }}"
              sat: "{{ (85 + 15 * progress) | round(1) }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - "{{ hue }}"
                - "{{ sat }}"
              brightness_pct: 100
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"

# ==================== EVENING DIMMING (Every Day) ====================
# Hold deep red, then dim 100% -> 25% from 9-10 PM. The color shift is done by
# ~8 PM; the wait is just a guard in case it was started late by hand.

- id: evening_dim
  alias: "Evening Dim"
  description: "Gradually dim lights from 100% to 25% starting at 9 PM"
  triggers:
    - trigger: time
      at: "21:00:00"
  mode: restart
  actions:
    - wait_template: "{{ state_attr('automation.evening_color_shift', 'current') | int(0) == 0 }}"
      timeout: "01:00:00"
    - variables:
        total_steps: 12
        step_seconds: 300
    - repeat:
        count: "{{ total_steps }}"
        sequence:
          - variables:
              progress: "{{ repeat.index / total_steps}}"
              brightness: "{{ (100 - 75 * progress) | round(0) | int }}"
          - service: light.turn_on
            target:
              entity_id: >
                {{ ['light.right_desk_lamp', 'light.standing_lamp', 'light.nightstand_lamp']
                   | select('is_state', 'on') | list }}
            data:
              hs_color:
                - 0
                - 100
              brightness_pct: "{{ brightness }}"
              transition: 5
          - delay:
              seconds: "{{ step_seconds }}"
